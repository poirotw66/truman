  toastEl = document.createElement("div"); toastEl.className = "toast"; toastEl.textContent = text;
  ov.appendChild(toastEl);
  const el = toastEl; setTimeout(() => { if (el.parentNode) el.remove(); if (toastEl === el) toastEl = null; }, 2300);
}

/* ============================ 每 tick 的節拍 ============================ */
function enterTick(t, animate) {
  cur = clamp(t, 0, MAXT); sub = 0;
  for (const k in fired) delete fired[k];
  renderHud(); renderRoster(); renderFeed(false);
  if (selected) openSheet(selected);
}
function tickBeats(now) {
  const fr = F[cur];
  fr.events.forEach((e, i) => {
    const key = cur + ":" + i;
    if (fired[key]) return;
    if (e.kind === "attack" && sub > .34) {
      fired[key] = 1;
      const A = F[cur].agents[e.agent], B = F[cur].agents[e.target];
      fxList.push({ kind:"slash", t0:now, life:420, ax:A.x+.5, ay:A.y+.5, bx:B.x+.5, by:B.y+.5 });
      fxList.push({ kind:"blood", t0:now+120, life:520, bx:B.x+.5, by:B.y+.5, seed:Math.random()*6 });
      fxLunge[e.agent] = 1; fxLungeDir[e.agent] = { x:B.x-A.x, y:B.y-A.y };
      setTimeout(() => { fxLunge[e.agent] = 0; }, 260);
      if (!reduced) { shake = 9; flash = 1; hold = now + 260; }
    } else if (e.kind === "death" && sub > .5) {
      fired[key] = 1; toast(e.name + " 歿");
      if (!reduced) { shake = 6; flash = .8; hold = now + 420; }
    }
  });
}

/* ============================ 鏡頭目標 ============================ */
function camTarget() {
  const fr = F[cur], live = IDS.filter(id => fr.agents[id].alive);
  let focus = null, z = 1;
  const att = fr.events.find(e => e.kind === "attack") || fr.events.find(e => e.kind === "death");
  const sp = fr.events.find(e => e.kind === "speech");
  if (att) {
    const A = fr.agents[att.agent], B = att.target ? fr.agents[att.target] : A;
    focus = { x:(A.x+B.x)/2 + .5, y:(A.y+B.y)/2 + .5 }; z = 2.1;
  } else if (sp) {
    const A = fr.agents[sp.agent], B = sp.to && fr.agents[sp.to] ? fr.agents[sp.to] : A;
    focus = { x:(A.x+B.x)/2 + .5, y:(A.y+B.y)/2 + .5 }; z = 1.6;
  } else if (live.length) {
    let sx = 0, sy = 0, minx=99, maxx=-99, miny=99, maxy=-99;
    live.forEach(id => { const a = fr.agents[id]; sx += a.x; sy += a.y;
      minx=Math.min(minx,a.x); maxx=Math.max(maxx,a.x); miny=Math.min(miny,a.y); maxy=Math.max(maxy,a.y); });
    focus = { x:sx/live.length + .5, y:sy/live.length + .5 };
    const spread = Math.max((maxx-minx)/W, (maxy-miny)/H);
    z = clamp(1 / Math.max(.42, spread + .28), 1, 1.7);
  } else focus = { x:W/2, y:H/2 };
  if (selected) { const a = fr.agents[selected]; focus = { x:a.x+.5, y:a.y+.5 }; z = Math.max(z, 1.8); }
  camT.x = focus.x; camT.y = focus.y; camT.z = clamp(z * Math.pow(1.25, userZoom), 1, 3.4);
}

/* ============================ 主迴圈 ============================ */
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(90, now - (last || now)); last = now;
  if (started && playing && now > hold) {
    sub += dt / (TICK_MS / speed);
    if (sub >= 1) { if (cur >= MAXT) { setPlay(false); sub = 1; showOutro(); } else { enterTick(cur + 1, true); } }
  }
  if (started) tickBeats(now);
  if (camMode === "follow") camTarget();
  else { camT.x = W/2; camT.y = H/2; camT.z = clamp(Math.pow(1.25, userZoom), 1, 3.4); }
  clampCam(camT);
  const k = reduced ? 1 : 1 - Math.pow(.001, dt/1000);
  cam.x = lerp(cam.x, camT.x, k*0.9); cam.y = lerp(cam.y, camT.y, k*0.9); cam.z = lerp(cam.z, camT.z, k*0.7);
  clampCam(cam);
  shake *= Math.pow(.86, dt/16); if (shake < .3) shake = 0;
  flash *= Math.pow(.9, dt/16); if (flash < .02) flash = 0;
  drawFrame(now); syncOverlay();
  const el = feedEl.querySelector(".fe.now");
  document.getElementById("fill").style.width = (cur/MAXT*100) + "%";
  document.getElementById("knob").style.left = (cur/MAXT*100) + "%";
}

      <canvas data-id="${id}" width="46" height="46"></canvas>
      <div class="n">${esc(P[id].name)}</div><div class="s">${esc(P[id].sect)}</div>
      <div class="g">${esc(P[id].goal)}</div></div>`).join("");
  const d = overlay(`
    <div class="k">TRUMAN · 生成式代理箱庭</div>
    <h2>衡山城 · 劉正風金盆洗手</h2>
    <p class="lede">六個 AI 被放進同一天的同一座城。沒有人寫劇本，每個人只看得見自己看得見的東西、
      只記得自己記得的事。他們的目標互相排斥——而這個世界允許他們拔刀。<br>
      以下是那一天的完整實錄，一刻十分鐘，共 ${MAXT} 刻。</p>
    <div class="cast">${cards}</div>
    <div class="btns"><button class="big" id="go">▶ 進　城</button>
      <button class="big ghost" id="skip">直接看結局</button></div>`);
  d.querySelectorAll(".cc canvas").forEach(c => drawPortrait(c.getContext("2d"), 46, P[c.dataset.id]));
  d.querySelector("#go").onclick = () => { d.remove(); started = true; enterTick(0, false); renderFeed(true); setPlay(true); };
  d.querySelector("#skip").onclick = () => { d.remove(); started = true; enterTick(MAXT, false); renderFeed(true); showOutro(); };
}
function showOutro() {
  if (document.querySelector(".over")) return;
  const live = IDS.filter(id => F[MAXT].agents[id].alive);
  const tomb = deaths.map(d => `<div><span class="who" style="color:${P[d.id].color}">${esc(d.name)}</span>
      <span style="color:#b9ac92">${clockOf(d.t).str}　${esc(P[d.id].sect)}</span>
      <span class="by">死於 ${P[d.by] ? esc(P[d.by].name) : "不明"}</span></div>`).join("");
  const s = DATA.stats || {};
  const d = overlay(`
    <div class="k">亥時 · 這一天結束了</div>
    <h2>${live.length === 1 ? "只剩一個人站著" : "城裡靜下來了"}</h2>
    <div class="tomb">${tomb}</div>
    <p class="lede">活到最後的是 ${live.map(id => `<b style="color:${P[id].color}">${esc(P[id].name)}</b>`).join("、")}。
      沒有人被劇本指使——每一刀都是某個 agent 自己算過之後決定的。</p>
    <div class="nums">
      <div><b>${s.speeches ?? "—"}</b><span>句對話</span></div>
      <div><b>${s.attacks ?? moments.filter(m=>m.kind==="attack").length}</b><span>次動手</span></div>
      <div><b>${deaths.length}</b><span>人死了</span></div>
      <div><b>${MAXT}</b><span>個決策時刻</span></div>
    </div>
    <div class="btns"><button class="big" id="again">↻ 再看一次</button>
      <button class="big ghost" id="stay">留在最後一刻</button></div>`);
  d.querySelector("#again").onclick = () => { d.remove(); enterTick(0, false); renderFeed(true); setPlay(true); };
  d.querySelector("#stay").onclick = () => d.remove();
}

/* ============================ 啟動 ============================ */
new ResizeObserver(() => layout()).observe(stage);
layout(); enterTick(0, false); renderFeed(true);
cam.x = camT.x = W/2; cam.y = camT.y = H/2; cam.z = camT.z = 1;
requestAnimationFrame(loop);
showIntro();
</script>
