<title>箱庭回放</title>
<style>
  :root{
    --bg:#12100c; --bg2:#1b1811; --panel:#211d15; --panel2:#2a251b;
    --ink:#f0e6d0; --ink2:#a99b7e; --line:rgba(240,230,205,.13); --line2:rgba(240,230,205,.26);
    --gold:#d9a63c; --cinnabar:#c8483a; --jade:#5aa38f; --violet:#b98ede;
    --disp:"Songti SC","STSong","Source Han Serif SC","Noto Serif CJK SC","PMingLiU",serif;
    --ui:"PingFang SC","Source Han Sans SC","Noto Sans CJK SC","Microsoft JhengHei",sans-serif;
    --mono:ui-monospace,"Cascadia Mono",Menlo,Consolas,monospace;
    --shadow:0 6px 22px rgba(0,0,0,.45);
  }
  :root[data-theme="light"]{
    --bg:#e9dcbe; --bg2:#f2e8ce; --panel:#f6eeda; --panel2:#ece0c2;
    --ink:#25211a; --ink2:#6d6350; --line:rgba(37,33,26,.14); --line2:rgba(37,33,26,.28);
    --shadow:0 6px 20px rgba(60,48,26,.18);
  }
  @media (prefers-color-scheme:light){
    :root:not([data-theme="dark"]){
      --bg:#e9dcbe; --bg2:#f2e8ce; --panel:#f6eeda; --panel2:#ece0c2;
      --ink:#25211a; --ink2:#6d6350; --line:rgba(37,33,26,.14); --line2:rgba(37,33,26,.28);
      --shadow:0 6px 20px rgba(60,48,26,.18);
    }
  }
  *{box-sizing:border-box}
  .jh{font-family:var(--ui); color:var(--ink); background:
      radial-gradient(120% 90% at 50% -20%, color-mix(in srgb,var(--panel) 60%,transparent), transparent 65%), var(--bg);
      min-height:100%; padding:clamp(10px,1.6vw,22px); line-height:1.5; -webkit-font-smoothing:antialiased}
  .wrap{max-width:1320px; margin:0 auto; display:flex; flex-direction:column; gap:12px}

  /* ---------- top bar ---------- */
  .topbar{display:flex; align-items:center; gap:14px 20px; flex-wrap:wrap;
    background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:10px 16px; box-shadow:var(--shadow)}
  .brand{display:flex; flex-direction:column; gap:2px; margin-right:auto}
  .brand .k{font-size:10px; letter-spacing:.34em; color:var(--gold); font-weight:700}
  .brand h1{margin:0; font-family:var(--disp); font-size:clamp(17px,2vw,24px); font-weight:600; letter-spacing:.04em}
  .stat{display:flex; flex-direction:column; align-items:flex-end; line-height:1.25}
  .stat .lab{font-size:10px; letter-spacing:.2em; color:var(--ink2)}
  .stat .val{font-family:var(--disp); font-size:19px; font-weight:600; font-variant-numeric:tabular-nums}
  .stat .val small{font-size:12px; color:var(--ink2); font-family:var(--ui)}
  .shichen{color:var(--gold)}
  .alive b{color:var(--jade)} .alive.bleed b{color:var(--cinnabar)}

  /* ---------- layout ---------- */
  .main{display:grid; grid-template-columns:minmax(0,1fr) 330px; gap:12px; align-items:stretch}
  @media(max-width:1000px){ .main{grid-template-columns:1fr} }

  .stagewrap{position:relative; aspect-ratio:3/2; border:1px solid var(--line2); border-radius:12px; overflow:hidden;
    background:#0d0b08; box-shadow:var(--shadow)}
  canvas#board{display:block; width:100%; height:100%; image-rendering:pixelated}
  .layer{position:absolute; inset:0; pointer-events:none; overflow:hidden}
  .vig{position:absolute; inset:0; pointer-events:none; box-shadow:inset 0 0 90px 20px rgba(0,0,0,.55); border-radius:12px}

  .plate{position:absolute; transform:translate(-50%,0); white-space:nowrap; font-size:10.5px; font-weight:700;
    padding:1px 6px; border-radius:20px; background:rgba(12,10,7,.72); color:#fdf6e4; letter-spacing:.06em;
    border:1px solid rgba(255,255,255,.14); text-shadow:0 1px 2px #000}
  .plate i{display:inline-block; width:6px; height:6px; border-radius:50%; margin-right:4px; vertical-align:middle}
  .plate.gone{opacity:.5; text-decoration:line-through}

  .bubble{position:absolute; max-width:230px; transform:translate(0,-100%);
    background:#fbf3df; color:#241f18; border-radius:10px; padding:6px 10px; font-size:12.5px; line-height:1.45;
    box-shadow:0 4px 14px rgba(0,0,0,.4); animation:pop .2s ease-out}
  .bubble b{font-family:var(--disp); font-weight:700; color:#7a2f26}
  .bubble .tail{position:absolute; bottom:-7px; width:0; height:0; border:7px solid transparent; border-top-color:#fbf3df; transform:translateX(-50%)}
  .bubble.below{transform:translate(0,0)}
  .bubble.below .tail{bottom:auto; top:-7px; border-top-color:transparent; border-bottom-color:#fbf3df}
  @keyframes pop{from{opacity:0; transform:translate(0,-92%) scale(.94)}}
  .bubble.below.pop2{animation:pop2 .2s ease-out}
  @keyframes pop2{from{opacity:0; transform:translate(0,6px) scale(.94)}}

  .toast{position:absolute; left:50%; top:14%; transform:translateX(-50%); font-family:var(--disp); font-size:26px;
    font-weight:700; letter-spacing:.28em; color:#ffe9c9; text-shadow:0 0 18px rgba(200,72,58,.9),0 3px 6px #000;
    animation:toast 2.2s ease-out forwards; white-space:nowrap}
  @keyframes toast{0%{opacity:0; transform:translateX(-50%) scale(.86)}18%{opacity:1; transform:translateX(-50%) scale(1)}70%{opacity:1}100%{opacity:0}}

  .camhint{position:absolute; right:10px; top:9px; display:flex; gap:6px}
  .chip{pointer-events:auto; font-family:var(--ui); font-size:11.5px; color:#f3e9d2; background:rgba(14,12,8,.66);
    border:1px solid rgba(255,255,255,.16); border-radius:20px; padding:4px 10px; cursor:pointer; backdrop-filter:blur(3px)}
  .chip:hover{background:rgba(217,166,60,.28)}
  .chip[aria-pressed="true"]{background:rgba(217,166,60,.32); border-color:var(--gold)}

  /* ---------- rail ---------- */
  .rail{display:flex; flex-direction:column; gap:12px; min-height:0; position:relative}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:12px; overflow:hidden; box-shadow:var(--shadow); display:flex; flex-direction:column; min-height:0}
  .card>h3{margin:0; padding:9px 13px; font-size:10.5px; font-weight:700; letter-spacing:.22em; color:var(--ink2);
    border-bottom:1px solid var(--line); display:flex; align-items:center; gap:8px}
  .card>h3 em{margin-left:auto; font-style:normal; color:var(--gold); letter-spacing:.08em}

  .roster{list-style:none; margin:0; padding:4px}
  .roster li{display:flex; gap:9px; align-items:center; padding:5px 7px; border-radius:8px; cursor:pointer; transition:background .15s}
  .roster li:hover{background:var(--panel2)}
  .roster li.sel{background:color-mix(in srgb,var(--gold) 20%,transparent)}
  /* 頭像框：像素小人直接畫在 canvas；Gemini 立繪要 zoom 對準臉，不能再 pixelated */
  .rface{flex:none; width:34px; height:34px; border-radius:9px; background:#171410; display:block;
    overflow:hidden; box-shadow:inset 0 0 0 1px rgba(255,240,210,.12)}
  canvas.rface{image-rendering:pixelated; width:34px; height:34px}
  .rface img{width:100%; height:100%; object-fit:cover; object-position:50% 14%;
    transform:scale(1.72); transform-origin:50% 16%; display:block}
  .rname{font-family:var(--disp); font-weight:600; font-size:14px}
  .rmeta{font-size:10.5px; color:var(--ink2)}
  .rstat{margin-left:auto; text-align:right}
  .tag{display:inline-block; padding:1px 7px; border-radius:20px; font-size:10.5px; font-weight:700}
  .tag.ok{background:color-mix(in srgb,var(--jade) 24%,transparent); color:var(--jade)}
  .tag.hurt{background:color-mix(in srgb,var(--gold) 26%,transparent); color:var(--gold)}
  .tag.crit{background:color-mix(in srgb,var(--cinnabar) 26%,transparent); color:#e4705f}
  .tag.dead{background:var(--line); color:var(--ink2)}
  .roster li.gone .rname{color:var(--ink2); text-decoration:line-through}
  .roster li.gone .rface{filter:grayscale(1) brightness(.6)}

  .feed{flex:1 1 auto; overflow-y:auto; padding:6px; display:flex; flex-direction:column; gap:5px; min-height:190px; max-height:min(46vh,420px)}
  .fe{display:flex; gap:8px; padding:5px 7px; border-radius:8px; font-size:12.2px; line-height:1.45; cursor:pointer; background:var(--panel2); border-left:3px solid transparent}
  .fe:hover{outline:1px solid var(--line2)}
  .fe .ic{flex:none; width:16px; height:16px; image-rendering:pixelated; margin-top:1px}
  .fe b{font-family:var(--disp); font-weight:600}
  .fe .t{font-family:var(--mono); font-size:10px; color:var(--ink2); margin-left:auto; flex:none; padding-left:6px}
  .fe.k-attack{border-left-color:var(--cinnabar)} .fe.k-death{border-left-color:#e4705f; background:color-mix(in srgb,var(--cinnabar) 15%,var(--panel2))}
  .fe.k-world{border-left-color:var(--ink2); color:var(--ink2); font-style:italic}
  .fe.k-reflection{border-left-color:var(--gold)}
  .fe.k-art{border-left-color:var(--violet)}
  .fe.k-note{border-left-color:var(--ink2); font-style:italic}
  .fe.k-goal{border-left-color:var(--jade); background:color-mix(in srgb,var(--jade) 12%,var(--panel2))}
  .fe.k-goalx{border-left-color:#a2564e; background:color-mix(in srgb,var(--cinnabar) 10%,var(--panel2))}
  .fe.now{outline:1px solid var(--gold)}
  .feed::-webkit-scrollbar,.body::-webkit-scrollbar{width:8px} .feed::-webkit-scrollbar-thumb,.body::-webkit-scrollbar-thumb{background:var(--line2); border-radius:8px}

  /* ---------- character card ---------- */
  .sheet{position:absolute; inset:0; z-index:20; background:var(--panel); border:1px solid var(--line2); border-radius:12px;
    display:flex; flex-direction:column; box-shadow:var(--shadow); overflow:hidden}
  .sheet .hd{display:flex; gap:12px; align-items:flex-start; padding:12px 13px; border-bottom:1px solid var(--line); background:var(--panel2)}
  .sheet .bust{width:112px; height:149px; border-radius:8px; flex:none; object-fit:cover; object-position:50% 8%;
    display:block; box-shadow:0 3px 12px rgba(0,0,0,.55); transition:filter .3s, transform .2s;
    background:#120e0a}
  .sheet canvas.bust{image-rendering:pixelated; object-position:unset}
  .sheet img.bust{cursor:zoom-in; border:1px solid rgba(255,240,210,.16)}
  .sheet img.bust:hover{transform:translateY(-1px); filter:brightness(1.04)}
  .sheet .vignette{width:100%; aspect-ratio:3/2; object-fit:cover; border-radius:8px; display:block;
    margin-top:6px; border:1px solid var(--line)}
  .ptlb{position:fixed; inset:0; z-index:80; background:rgba(6,4,3,.92); display:flex; align-items:center;
    justify-content:center; padding:24px; cursor:zoom-out; animation:fade .25s ease}
  .ptlb img{max-width:min(560px,92vw); max-height:88vh; border-radius:10px; box-shadow:0 18px 60px rgba(0,0,0,.7);
    border:1px solid rgba(255,240,210,.14)}
  .ptlb .cap{position:absolute; bottom:22px; left:0; right:0; text-align:center; color:#e9dcbe;
    font-family:var(--disp); font-size:17px; letter-spacing:.1em; text-shadow:0 2px 8px #000}
  .sheet .nm{font-family:var(--disp); font-size:19px; font-weight:600; line-height:1.2}
  .sheet .sb{font-size:11px; color:var(--ink2)}
  .sheet .x{margin-left:auto; background:none; border:1px solid var(--line2); color:var(--ink2); width:26px; height:26px;
    border-radius:7px; cursor:pointer; font-size:14px; line-height:1}
  .sheet .x:hover{color:var(--ink); border-color:var(--gold)}
  .sheet .body{padding:11px 13px; overflow-y:auto; display:flex; flex-direction:column; gap:11px; font-size:12.5px}
  .sec{display:flex; flex-direction:column; gap:4px}
  .sec .lb{font-size:10px; letter-spacing:.2em; color:var(--gold); font-weight:700}
  /* 目的：一行一條，勾／叉／進行中三種狀態 */
  .quest{display:flex; flex-direction:column; gap:5px; margin-top:4px}
  .qz{display:flex; gap:8px; align-items:flex-start; font-size:12px; line-height:1.5;
    padding:5px 8px; border-radius:6px; border-left:3px solid var(--ink2);
    background:color-mix(in srgb,var(--panel2) 70%,transparent)}
  .qz b{flex:0 0 12px; font-size:13px; line-height:1.35}
  .qz em{display:block; font-style:normal; font-size:10.5px; color:var(--ink2); margin-top:1px}
  .qz.done{border-left-color:var(--jade)} .qz.done b{color:var(--jade)}
  .qz.fail{border-left-color:var(--cinnabar)} .qz.fail b{color:var(--cinnabar)}
  .qz.open{opacity:.78} .qz.open b{color:var(--gold)}
  /* 絕技：他手上有什麼工具、用掉了幾次 */
  .arts{display:flex; flex-direction:column; gap:4px; margin-top:4px}
  .az{display:grid; grid-template-columns:28px 1fr auto; gap:1px 8px; align-items:center;
    font-size:11.5px; padding:5px 8px; border-radius:6px; border-left:3px solid var(--line2);
    background:color-mix(in srgb,var(--panel2) 60%,transparent)}
  .az .aic{width:28px; height:28px; border-radius:6px; object-fit:cover; grid-row:1/3;
    box-shadow:0 1px 4px rgba(0,0,0,.35)}
  .az b{font-size:12px; letter-spacing:.03em}
  .az span{grid-column:2; font-size:10.5px; color:var(--ink2)}
  .az u{grid-row:1/3; grid-column:3; align-self:center; text-decoration:none;
    font-size:10.5px; color:var(--ink2)}
  .az.used{border-left-color:var(--violet)}
  .az.used b{color:var(--violet)} .az.used u{color:var(--violet)}
  .fe .ic.art{border-radius:4px}
  .sec .goal{font-family:var(--disp); font-size:14px; line-height:1.5}
  .sec p{margin:0; color:var(--ink); line-height:1.62}
  .sec p.q{color:var(--ink2); border-left:2px solid var(--line2); padding-left:8px}
  .said{display:flex; flex-direction:column; gap:5px}
  .said div{background:var(--panel2); border-radius:7px; padding:5px 8px; line-height:1.45; cursor:pointer}
  .said div:hover{outline:1px solid var(--line2)}
  .said em{font-style:normal; color:var(--ink2); font-family:var(--mono); font-size:10px}
  .rel{display:flex; flex-wrap:wrap; gap:5px}
  .rel span{font-size:11px; padding:2px 8px; border-radius:20px; background:var(--panel2); border:1px solid var(--line)}
  .rel span.kin{border-color:var(--jade); color:var(--jade)}
  .rel span.foe{border-color:var(--cinnabar); color:#e4705f}
  .bars{display:flex; gap:3px; align-items:center}
  .bars i{width:9px; height:12px; border-radius:2px; background:var(--line2); display:inline-block}
  .bars i.on{background:var(--gold)}

  /* ---------- transport ---------- */
  .transport{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:11px 14px;
    display:flex; flex-direction:column; gap:10px; box-shadow:var(--shadow)}
  .ctrls{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
  button.ct{font-family:var(--ui); font-size:12.5px; color:var(--ink); background:var(--panel2); border:1px solid var(--line2);
    border-radius:8px; padding:7px 11px; cursor:pointer; transition:background .15s, transform .07s}
  button.ct:hover{background:color-mix(in srgb,var(--gold) 18%,var(--panel2))}
  button.ct:active{transform:translateY(1px)}
  button.ct[disabled]{opacity:.38; cursor:default}
  button.play{min-width:88px; font-weight:700}
  .spd{display:flex; gap:2px} .spd button{padding:6px 8px; font-size:11.5px}
  .spd button[aria-pressed="true"]{background:color-mix(in srgb,var(--gold) 32%,var(--panel2)); border-color:var(--gold)}
  .sep{width:1px; height:22px; background:var(--line2); margin:0 2px}

  .track{position:relative; height:30px; flex:1 1 240px; min-width:190px}
  input.seek{position:absolute; inset:0; width:100%; height:100%; margin:0; opacity:0; cursor:pointer; z-index:5}
  .rail-bg{position:absolute; left:0; right:0; top:13px; height:6px; border-radius:4px; background:var(--line2)}
  .fill{position:absolute; left:0; top:13px; height:6px; border-radius:4px; background:linear-gradient(90deg,var(--gold),var(--cinnabar))}
  .knob{position:absolute; top:8px; width:16px; height:16px; border-radius:50%; background:var(--ink); border:3px solid var(--panel); transform:translateX(-50%); z-index:3}
  .mk{position:absolute; top:1px; transform:translateX(-50%); z-index:2; cursor:pointer; line-height:0}
  .mk img{width:14px; height:14px; image-rendering:pixelated}
  .mk.a{opacity:.9}
  .mk.a img{width:12px; height:12px}
  .tickno{font-family:var(--mono); font-size:11.5px; color:var(--ink2); font-variant-numeric:tabular-nums}
  .legend{display:flex; flex-wrap:wrap; gap:4px 14px; font-size:10.5px; color:var(--ink2); align-items:center}
  .legend span{display:inline-flex; align-items:center; gap:5px}
  .legend i{width:9px; height:9px; border-radius:2px; display:inline-block}
  .legend .ic{width:13px; height:13px; image-rendering:pixelated; vertical-align:-2px}

  /* ---------- overlays ---------- */
  .over{position:fixed; inset:0; z-index:60; background:rgba(9,7,5,.86); backdrop-filter:blur(6px);
    display:flex; align-items:center; justify-content:center; padding:20px; overflow-y:auto; animation:fade .35s ease}
  @keyframes fade{from{opacity:0}}
  .over .in{max-width:940px; width:100%; display:flex; flex-direction:column; gap:16px; text-align:center; color:#f3e8ce}
  .over .k{font-size:11px; letter-spacing:.4em; color:var(--gold); font-weight:700}
  .over h2{margin:0; font-family:var(--disp); font-size:clamp(26px,4.4vw,44px); font-weight:600; letter-spacing:.06em}
  .over .lede{margin:0 auto; max-width:44em; font-size:13.5px; line-height:1.85; color:#c9bda2}
  .cast{display:grid; grid-template-columns:repeat(auto-fit,minmax(158px,1fr)); gap:11px}
  .cc{background:rgba(255,247,228,.05); border:1px solid rgba(255,240,210,.14); border-radius:11px; padding:11px 9px;
    display:flex; flex-direction:column; align-items:center; gap:5px; animation:rise .5s backwards}
  @keyframes rise{from{opacity:0; transform:translateY(14px)}}
  .cc canvas{width:78px; height:104px; image-rendering:pixelated; border-radius:5px; box-shadow:0 4px 12px rgba(0,0,0,.45)}
  .cc img.pt{width:100%; aspect-ratio:3/4; object-fit:cover; object-position:50% 6%; border-radius:7px;
    display:block; box-shadow:0 5px 16px rgba(0,0,0,.5); border:1px solid rgba(255,240,210,.14);
    transition:transform .22s ease, box-shadow .22s ease}
  .cc:hover img.pt{transform:translateY(-3px) scale(1.02); box-shadow:0 10px 22px rgba(0,0,0,.55)}
  .cc .n{font-family:var(--disp); font-size:15px; font-weight:600}
  .cc .s{font-size:10px; color:var(--gold); letter-spacing:.1em}
  .cc .g{font-size:11.5px; color:#c2b699; line-height:1.5; min-height:3em}
  .over .btns{display:flex; gap:10px; justify-content:center; flex-wrap:wrap}
  button.big{font-family:var(--disp); font-size:15px; font-weight:600; letter-spacing:.16em; color:#1a1610;
    background:linear-gradient(180deg,var(--gold),#b8842a); border:0; border-radius:9px; padding:11px 30px; cursor:pointer}
  button.big.ghost{background:none; color:#c9bda2; border:1px solid rgba(255,240,210,.24)}
  button.big:hover{filter:brightness(1.08)}
  .tomb{display:flex; flex-direction:column; gap:6px; max-width:520px; margin:0 auto; width:100%}
  .tomb div{display:flex; gap:10px; align-items:center; background:rgba(200,72,58,.12); border:1px solid rgba(200,72,58,.3);
    border-radius:9px; padding:7px 12px; font-size:13px}
  .tomb .who{font-family:var(--disp); font-size:15px; font-weight:600}
  .tomb .by{margin-left:auto; color:#c9a08f; font-size:12px}
  /* 片尾成績單 */
  .score{display:flex; flex-direction:column; gap:5px; max-width:620px; margin:0 auto; width:100%}
  .score .sh{font-size:10px; letter-spacing:.28em; color:var(--gold); font-weight:700; margin-bottom:3px}
  .score .sr{display:flex; gap:10px; align-items:center; padding:6px 12px; border-radius:8px;
    background:rgba(255,255,255,.045); border:1px solid rgba(255,255,255,.08)}
  .score .sf{flex:none; width:28px; height:28px; border-radius:7px; overflow:hidden; background:#171410;
    box-shadow:inset 0 0 0 1px rgba(255,240,210,.12)}
  .score .sf img{width:100%; height:100%; object-fit:cover; object-position:50% 14%;
    transform:scale(1.7); transform-origin:50% 16%; display:block}
  .score .who{font-family:var(--disp); font-size:14px; font-weight:600; flex:0 0 62px; text-align:left}
  .score .gt{flex:1; text-align:left; font-size:11.5px; color:#c3b79c; line-height:1.5}
  .score .gm{display:flex; gap:4px; margin-left:auto}
  .score .gm i{font-style:normal; width:19px; height:19px; border-radius:5px; font-size:12px;
    display:grid; place-items:center; cursor:help}
  .score .gm i.y{background:rgba(90,163,143,.26); color:#8fd8c0; border:1px solid rgba(90,163,143,.5)}
  .score .gm i.n{background:rgba(200,72,58,.2); color:#eda79c; border:1px solid rgba(200,72,58,.42)}
  .nums{display:flex; gap:22px; justify-content:center; flex-wrap:wrap}
  .nums div{display:flex; flex-direction:column}
  .nums b{font-family:var(--disp); font-size:27px; font-weight:600; color:var(--gold)}
  .nums span{font-size:10.5px; letter-spacing:.16em; color:#a1957c}

<script>
"use strict";
const DATA = /*__DATA__*/ null;
const F = DATA.frames, ROWS = DATA.rows, W = ROWS[0].length, H = ROWS.length, MAXT = DATA.max_tick;
const CAST = {}; DATA.cast.forEach(c => CAST[c.id] = c);
const IDS = DATA.cast.map(c => c.id);
const reduced = matchMedia("(prefers-reduced-motion:reduce)").matches;
const SCENARIO = DATA.scenario || "jianghu";
const FLOOD_TICK = (DATA.flood_tick == null) ? -1 : DATA.flood_tick;
const FLOODED = (DATA.flooded || []).map(xy => xy[0] + "," + xy[1]);
const FLOOD_SET = new Set(FLOODED);

/* ============================ 人物設定（美術 + 文案） ============================ */
/* 江湖劇本有手繪像素立繪規格；其他劇本從 DATA.cast 生成可用的預設。 */
const BAKED = {
  liu_zhengfeng:{ch:"劉", name:"劉正風", sect:"衡山派", title:"劉三爺", color:"#4f9b86",
    robe:"#3f7d6e", trim:"#25584c", hair:"#241d16", hat:"bun", beard:"short", weapon:"sword", acc:"jade", brow:"flat", mouth:"small",
    goal:"把這個手洗完。誰來說什麼，都忍。",
    blurb:"衡山派掌門莫大先生的師弟，劍法極高，在城裡住了半輩子，人緣極好。他藏著一個會要命的秘密：最好的朋友曲洋是魔教長老。金盆洗手是他想了很久的辦法——洗了手就不再是五嶽劍派的人，往後和誰來往，誰也管不著。"},
  fei_bin:{ch:"費", name:"費彬", sect:"嵩山派", title:"大嵩陽手", color:"#6f7a94",
    robe:"#3d4457", trim:"#20242f", hair:"#191510", hat:"official", beard:"none", weapon:"sword", brow:"stern", mouth:"frown",
    goal:"攔下這場洗手。用什麼手段都可以。",
    blurb:"左冷禪最信得過的心腹，奉密令而來：五嶽劍派要並成一派，衡山這根釘子不能鬆。他手上還有一件東西——有人密報劉正風私通魔教長老曲洋。他在等一個時機把它當眾抖出來。他辦事講究名正言順，要動手也要動得讓人說不出話。"},
  linghu_chong:{ch:"沖", name:"令狐沖", sect:"華山派", title:"岳不群大弟子", color:"#c9903a",

    goal:"少說話、別惹事——他自己也知道當不得真。",
    blurb:"愛喝酒、愛開玩笑、不太守規矩。師父嫌他沒個正形，他自己覺得人活著總要對得起朋友。劍法在同輩裡算好的，可這城裡到處是成名多年的高手，真動起手來他打不過，他心裡有數。他最看不得以強欺弱，看到了就會插手，就算插手的下場是自己倒楣。"},
  yi_lin:{ch:"琳", name:"儀琳", sect:"恆山派", title:"定逸師太弟子", color:"#cf8fa4",

    blurb:"十六歲的小尼姑，心軟、膽小、不會說謊。跟師父來衡山賀劉三爺洗手，路上走散了，現在一個人在城裡，有點怕。她武功很低，這裡任何一個人動起手來她都擋不住，她自己很清楚。遇到危險第一個念頭是逃，或者念經。有人對她好，她會記很久。"},
  tian_boguang:{ch:"田", name:"田伯光", sect:"萬里獨行", title:"快刀無雙", color:"#b84a3c",
    robe:"#8e3b31", trim:"#5c231d", hair:"#1b1610", hat:"band", beard:"stub", weapon:"blade", brow:"raise", mouth:"smirk", extra:"scar",

    blurb:"快刀是看家本事，十幾年沒人抓得住他，也是有名的採花大盜，正道人人喊打，他不在乎。他有他的規矩：不殺沒有還手之力的人，也不喜歡在人多的地方動手。他怕的東西不多，但他不想惹上整個五嶽劍派——能不當眾撕破臉，就不當眾撕破臉。"},
  qu_yang:{ch:"曲", name:"曲洋", sect:"日月神教", title:"長老", color:"#8b6bab",
    robe:"#6b4a86", trim:"#42295a", hair:"#ddd6c8", hat:"bun", beard:"long", weapon:"qin", brow:"flat", mouth:"line",
    goal:"遠遠看他一眼就走。別連累他。",
    blurb:"在旁人眼裡只是個愛琴的老人。這輩子在教中殺過不少人，到了這個年紀發現真正放不下的只有琴，還有一個懂琴的人。他和劉正風合譜了一曲《笑傲江湖》，那是他這輩子做過最好的事。正邪之分在他眼裡是笑話——可他知道，這個笑話會要人命。"},
};
const PIXEL_FALLBACK = {
  robe:"#6b6252", trim:"#3b3529", hair:"#241d16", hat:"bun", beard:"none",
  weapon:null, brow:"flat", mouth:"small",
};
const P = {};
DATA.cast.forEach((c, i) => {
  if (BAKED[c.id]) { P[c.id] = BAKED[c.id]; return; }
  P[c.id] = Object.assign({}, PIXEL_FALLBACK, {
    ch: c.ch || (c.name || "?")[0],
    name: c.name,
    sect: c.sect || c.home || "",
    title: c.title || c.home || "",
    color: c.color || ["#4f9b86","#6f7a94","#c9903a","#cf8fa4","#b84a3c","#8b6bab"][i % 6],
    goal: c.goal || "",
    blurb: c.blurb || "",
  });
});
document.title = DATA.title || document.title;
const _tEl = document.getElementById("pageTitle"); if (_tEl) _tEl.textContent = DATA.title || _tEl.textContent;
const _fEl = document.getElementById("pageFoot"); if (_fEl && DATA.foot) _fEl.innerHTML = DATA.foot;
const _rEl = document.getElementById("rosterLabel"); if (_rEl) _rEl.textContent = IDS.length + "人";
const AREA_OF = {}; DATA.areas.forEach(a => AREA_OF[a.name] = a);
const PORTRAIT = DATA.portraits || {};          // Gemini 產的立繪；沒有就退回程式畫的像素立繪
const SCENES = DATA.scenes || {};               // 場景／關鍵美術；沒有就退回像素城底圖
const ART_ICONS = DATA.art_icons || {};         // 絕技圖示（按 art id）
const ART_ICON_BY_NAME = (() => {
  const m = {};
  (DATA.cast || []).forEach(c => (c.arts || []).forEach(a => {
    if (a.id && ART_ICONS[a.id]) m[a.name] = ART_ICONS[a.id];
  }));
  return m;
})();
function artIconSrc(idOrName) {
  return ART_ICONS[idOrName] || ART_ICON_BY_NAME[idOrName] || ICONS.art;
}
function lightbox(id) {
  if (!PORTRAIT[id]) return;
  const d = document.createElement("div"); d.className = "ptlb";
  d.innerHTML = `<img src="${PORTRAIT[id]}" alt="${esc(P[id].name)}">
    <div class="cap">${esc(P[id].name)}　${esc(P[id].sect)} · ${esc(P[id].title)}
      <span style="opacity:.6;font-size:12px;letter-spacing:.06em">　（點任一處或按 Esc 關閉）</span></div>`;
  d.onclick = () => d.remove();
  document.body.appendChild(d);
}

/* ============================ 工具 ============================ */
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const ZHI = ["子","丑","寅","卯","辰","巳","午","未","申","酉","戌","亥"];
function clockOf(t) {
  const m = 360 + t * 10, hh = Math.floor(m / 60) % 24, mm = m % 60;
  const sc = ZHI[Math.floor(((hh + 1) % 24) / 2) % 12];
  let ph;
  if (SCENARIO === "tempest") {
    if (hh < 8) ph = "清晨 · 雲色不對";
    else if (hh < 11) ph = "午前 · 潮訊收緊";
    else if (hh < 14) ph = "正午 · 人往北擠";
    else if (hh < 17) ph = "午後 · 禮與閘搶時";
    else if (hh < 19) ph = "黃昏 · 潮頭將近";
    else ph = "入夜 · 暴潮過後";
  } else {
    ph = "午後 · 該了的事要了";
    if (hh < 8) ph = "清晨 · 賓客陸續到"; else if (hh < 11) ph = "午前 · 吉時將近";
    else if (hh < 14) ph = "正午 · 演武場最擠"; else if (hh < 18) ph = "午後 · 該了的事要了";
    else if (hh < 20) ph = "黃昏 · 街店上門板"; else ph = "入夜 · 燈籠亮起";
  }
  return { hh, mm, sc, ph, str: String(hh).padStart(2,"0") + ":" + String(mm).padStart(2,"0") };
}

function deathCause(by) {
  if (!by) return "";
  if (P[by]) return "死於" + P[by].name;
  if (by === "暴潮") return "被暴潮捲走";
  return "死於" + by;
}

/* ============================ 像素美術（共用模組，注入自 web/pixelart.js） ============================ */
/*__PIXELART__*/
/* 事件流／時間軸的小圖示：有插畫就用插畫，否則退回程式畫的像素圖（跟地圖一致）。 */
const PIXEL_ICONS = (() => {
  const S = 2, mk = fn => {
    const c = document.createElement("canvas"); c.width = c.height = 16 * S;
    const g = c.getContext("2d");
    const R = (x, y, w, h, col) => { g.fillStyle = col; g.fillRect(x*S, y*S, Math.max(1,w*S), Math.max(1,h*S)); };
    const dia = (x, y, n, w, col, dir) => { for (let i = 0; i < n; i++) R(x + i, y + (dir > 0 ? i : n - 1 - i), w, w, col); };
    fn(R, dia); return c.toDataURL();
  };
  return {
    speech: mk(R => { R(1,2,14,9,"#171210"); R(2,3,12,7,"#f3ead3"); R(3,10,5,3,"#171210"); R(4,10,3,2,"#f3ead3"); }),
    attack: mk((R, dia) => { dia(2,2,12,2,"#171210",1); dia(2,2,12,2,"#171210",-1);
      dia(2.5,2.5,11,1.4,"#cfd4da",1); dia(2.5,2.5,11,1.4,"#c8483a",-1); }),
    death:  mk(R => { R(3,2,10,9,"#171210"); R(4,3,8,7,"#e8e0cc"); R(5,5,2,3,"#171210"); R(9,5,2,3,"#171210");
      R(4,10,8,3,"#171210"); R(5,10,6,2,"#e8e0cc"); R(7,10,1,2,"#171210"); }),
    reflection: mk(R => { R(7,1,2,14,"#171210"); R(1,7,14,2,"#171210");
      R(7.4,1.6,1.2,12.8,"#d9a63c"); R(1.6,7.4,12.8,1.2,"#d9a63c"); R(6,6,4,4,"#171210"); R(6.5,6.5,3,3,"#ffe9a8"); }),
    world:  mk(R => { R(1,2,14,12,"#171210"); R(2,4,12,8,"#e6dcc0"); R(2,2,12,2,"#6b4a2c"); R(2,12,12,2,"#6b4a2c");
      R(4,6,8,1,"#8a7a58"); R(4,8,6,1,"#8a7a58"); }),
    interact: mk(R => { R(6,1,4,14,"#171210"); R(6.6,2,2.8,12,"#c0a45a"); }),
    // 絕技：捲軸／符籙的樣子，和刀光（attack）明顯區隔開
    art: mk(R => { R(2,2,12,12,"#171210"); R(3,3,10,10,"#6b3f8a"); R(4,4,8,8,"#b98ede");
      R(7,5,2,6,"#f3ead3"); R(5,7,6,2,"#f3ead3"); }),
    // 目的達成／落空：一個勾、一個叉，顏色在 renderFeed 那邊分
    goal: mk(R => { R(2,2,12,12,"#171210"); R(3,3,10,10,"#2e5e46");
      R(5,7,2,4,"#9be8c0"); R(6,9,2,2,"#9be8c0"); R(8,6,2,2,"#9be8c0"); R(9,4,2,3,"#9be8c0"); }),
    goalx: mk((R, dia) => { R(2,2,12,12,"#171210"); R(3,3,10,10,"#6b2f2a");
      dia(4,4,8,1.6,"#f0a49c",1); dia(4,4,8,1.6,"#f0a49c",-1); }),
  };
})();
const ICONS = Object.assign({}, PIXEL_ICONS, DATA.event_icons || {});
/* image-rendered event icons look better without forced pixelation */
if (DATA.event_icons) {
  const st = document.createElement("style");
  st.textContent = ".fe .ic,.mk img,.legend .ic{image-rendering:auto;border-radius:3px}";
  document.head.appendChild(st);
}

const TS_ART = 48;                                  // 貼圖每格 48px（美術原生 16px × 3）
const worldDecor = (DATA.decor === "jianghu") ? DECOR_JIANGHU : [];
const world = buildWorldCanvas(ROWS, DATA.areas, TS_ART, worldDecor);
function faceCanvas(id, px) {
  const c = document.createElement("canvas"); c.width = c.height = px;
  drawPortrait(c.getContext("2d"), px, P[id]); return c;
}

/* 圍觀百姓（純裝飾）——只在衡山劇本放，嵐潮別拿廣場座標硬塞。 */
const CROWD = [];
(function(){
  if (SCENARIO !== "jianghu") return;
  const spots = [[6,6],[8,7],[11,6],[12,7],[7,8],[10,8],[9,4],[13,5],[9,2],[10,3],[18,7],[16,8]];
  const robes = ["#7a6a52","#6b7a62","#8a7a5e","#5f6673","#7d6459"];
  spots.forEach((s,i) => CROWD.push({ x:s[0]+ .5, y:s[1]+ .5, ph:i*1.7,
    prof:{ robe:robes[i%robes.length], trim:"#4a4033", hair:"#241d16", hat:i%3?"bun":"band", beard:"none", weapon:null },
    fx:s[0] < 12 ? -3 : W+3 }));
})();

/* ============================ 鏡頭 / 舞台 ============================ */
const stage = document.getElementById("stage"), board = document.getElementById("board");
const bx = board.getContext("2d"), ov = document.getElementById("ov");
let SW = 900, SH = 600, DPR = 1, baseTile = 30;
const cam = { x:W/2, y:H/2, z:1 }, camT = { x:W/2, y:H/2, z:1 };
let camMode = "follow", userZoom = 0;

function layout() {
  const r = stage.getBoundingClientRect();
  SW = Math.max(320, r.width); SH = Math.max(200, r.height);
  DPR = Math.min(2, window.devicePixelRatio || 1);
  board.width = Math.round(SW * DPR); board.height = Math.round(SH * DPR);
  bx.setTransform(DPR, 0, 0, DPR, 0, 0); bx.imageSmoothingEnabled = false;
  [scene, sharpCv].forEach(c => { c.width = board.width; c.height = board.height; });
  lightCv.width = Math.max(2, Math.round(board.width / 2));
  lightCv.height = Math.max(2, Math.round(board.height / 2));
  sc.imageSmoothingEnabled = false; shp.imageSmoothingEnabled = false;
  baseTile = Math.min(SW / (W + OUT * 2), SH / (H + OUT * 2));   // 留一點郊野在畫面裡
}
const OUT = 1.9;
const tileSize = () => baseTile * cam.z;
function toScreen(wxx, wyy) { const t = tileSize(); return { sx:(wxx - cam.x) * t + SW/2, sy:(wyy - cam.y) * t + SH/2 }; }
function clampCam(c) {
  const t = baseTile * c.z, halfW = SW/2/t, halfH = SH/2/t;
  const x0 = -OUT, x1 = W + OUT, y0 = -OUT, y1 = H + OUT;      // 可以看到一點城外，但不會看到空白
  c.x = (halfW * 2 >= x1 - x0) ? W/2 : clamp(c.x, x0 + halfW, x1 - halfW);
  c.y = (halfH * 2 >= y1 - y0) ? H/2 : clamp(c.y, y0 + halfH, y1 - halfH);
}

/* ============================ 播放狀態 ============================ */
let cur = 0, sub = 0, playing = false, speed = 1, last = 0, hold = 0, shake = 0, flash = 0;
const TICK_MS = 1500;
const fired = {};                                     // 這個 tick 的動手特效放過了沒
let fxList = [], toastEl = null, selected = null, started = false;

const posOf = (t, id) => { const a = F[t].agents[id]; return { x:a.x + .5, y:a.y + .5 }; };
function animPos(id) {                                 // 依 sub 在本 tick 的路徑上內插
  const a = F[cur].agents[id];
  const prev = cur > 0 ? F[cur-1].agents[id] : a;
  const steps = a.steps || null;
  const path = [[prev.x, prev.y]].concat(steps || [[a.x, a.y]]);
  const p = clamp(sub / .72, 0, 1) * (path.length - 1);
  const i = Math.min(path.length - 2, Math.floor(p)), f = p - i;
  if (path.length === 1) return { x:a.x + .5, y:a.y + .5, moving:false, dx:0, dy:0 };
  const A = path[i], B = path[i+1];
  return { x:lerp(A[0], B[0], f) + .5, y:lerp(A[1], B[1], f) + .5, moving:(A[0]!==B[0]||A[1]!==B[1]) && p < path.length-1, dx:B[0]-A[0], dy:B[1]-A[1] };
}
const faceOf = (m, id) => { if (!m.moving) return facing[id] || "down";
  const f = Math.abs(m.dx) > Math.abs(m.dy) ? (m.dx > 0 ? "right" : "left") : (m.dy > 0 ? "down" : "up");
  facing[id] = f; return f; };
const facing = {};

/* ============================ 每格畫面 ============================ */
function tintFor(t) {
  const h = 6 + t / 6;
  if (h < 8) return { c:"rgba(255,168,96,.20)", night:0 };
  if (h < 11) return { c:"rgba(255,240,205,.06)", night:0 };
  if (h < 14) return { c:"rgba(255,255,235,.02)", night:0 };
  if (h < 17) return { c:"rgba(255,204,132,.10)", night:0 };

const LANTERNS = SCENARIO === "jianghu"
  ? [[12,11.2],[14.6,11.2],[16.5,3.4],[18.4,3.4],[1.6,3.4],[3.4,3.4],[19.4,10.2],[21.4,10.2]]

/* ============================ HD-2D 合成 ============================
   場景先畫進離屏 canvas，再做三件事：移軸景深（上下模糊、中間清晰）、
   光源泛光（燈籠／金盆／刀光發散開來）、暖亮冷暗的調色與暗角。
   八方旅人的味道有一大半來自這三層，而不是圖磚本身。 */
const scene = document.createElement("canvas"), sc = scene.getContext("2d");
const sharpCv = document.createElement("canvas"), shp = sharpCv.getContext("2d");
const lightCv = document.createElement("canvas"), lgx = lightCv.getContext("2d");
const CAN_FILTER = (() => { const c = document.createElement("canvas").getContext("2d");
  c.filter = "blur(2px)"; return c.filter === "blur(2px)"; })();
let lights = [];
let DOF = 1, BLOOM = 1;                               // 0 = 關掉（給效能不夠的機器）

let frameCost = 16, slowFrames = 0, autoTuned = "";
function drawFrame(now) {
  const t0 = performance.now();
  try { drawFrameInner(now); }
  catch (e) {                                        // 合成掛了也不能讓整頁停住
    DOF = BLOOM = 0; autoTuned = "特效已關（" + e.message + "）";
    try { bx.setTransform(1,0,0,1,0,0); bx.drawImage(scene, 0, 0); } catch (e2) {}
  }
  // 自動降級：連續慢幀就把最貴的東西關掉，寧可醜也不能卡
  frameCost = frameCost * .9 + (performance.now() - t0) * .1;
  if (frameCost > 24) {
    if (++slowFrames > 45) {
      slowFrames = 0;
      if (DOF) { DOF = 0; autoTuned = "偵測到掉幀，已關閉景深"; }
      else if (BLOOM) { BLOOM = 0; autoTuned = "仍然掉幀，已關閉泛光"; }
      const b = document.getElementById("fxBtn"); if (b) b.textContent = fxLabel();
    }

}
function drawFrameInner(now) {
  const t = tileSize();
  const tint = drawScene(now, t);

  bx.setTransform(1, 0, 0, 1, 0, 0);
  bx.clearRect(0, 0, w, h);

  if (CAN_FILTER && DOF && !reduced) {
    // 移軸景深：模糊底 + 中間一條清晰帶。這兩個數字曾經調得太重，把像素美術
    // （地磚、劉府紅氈、演武場青石……）整片糊成米黃色；現在調輕：模糊半徑減半，
    // 清晰帶從畫面 34%（±.17）放寬到 50%（±.25），淡出邊界跟著外推，
    // 讓移軸的「這裡是焦點」效果還在，但不會把地圖大半吃掉。
    bx.save(); bx.filter = `blur(${Math.max(2, Math.round(h * .005))}px)`;
    bx.drawImage(scene, 0, 0, w, h); bx.restore();     // 模糊底
    shp.setTransform(1, 0, 0, 1, 0, 0);
    shp.globalCompositeOperation = "source-over";
    shp.clearRect(0, 0, w, h); shp.drawImage(scene, 0, 0);
    shp.globalCompositeOperation = "destination-in";   // 只留中間那條清晰帶
    const gy = shp.createLinearGradient(0, 0, 0, h), c0 = .5;
    gy.addColorStop(Math.max(0, c0 - .45), "rgba(0,0,0,0)");
    gy.addColorStop(Math.max(.02, c0 - .25), "rgba(0,0,0,1)");
    gy.addColorStop(Math.min(.98, c0 + .25), "rgba(0,0,0,1)");
    gy.addColorStop(Math.min(1, c0 + .45), "rgba(0,0,0,0)");
    shp.fillStyle = gy; shp.fillRect(0, 0, w, h);
    shp.globalCompositeOperation = "source-over";
    bx.drawImage(sharpCv, 0, 0);
  } else {
    bx.drawImage(scene, 0, 0);
  }

  if (BLOOM && lights.length) {                        // 泛光：光源畫成放射漸層再疊上去
    lgx.setTransform(DPR / 2, 0, 0, DPR / 2, 0, 0);
    lgx.clearRect(0, 0, SW, SH);
    lights.forEach(L => {
      const g2 = lgx.createRadialGradient(L.x, L.y, 0, L.x, L.y, Math.max(4, L.r));
      g2.addColorStop(0, L.c); g2.addColorStop(1, "rgba(0,0,0,0)");
      lgx.fillStyle = g2;

    });
    bx.save(); bx.globalCompositeOperation = "lighter";
    if (CAN_FILTER && !reduced) bx.filter = `blur(${Math.max(3, Math.round(h * .014))}px)`;
    bx.drawImage(lightCv, 0, 0, w, h); bx.restore();

  // 調色：中央偏暖、四周壓冷壓暗
  const gr = bx.createRadialGradient(w * .5, h * .42, h * .1, w * .5, h * .5, h * .95);
  gr.addColorStop(0, "rgba(255,206,140,.10)");
  gr.addColorStop(.55, "rgba(255,190,120,.02)");
  gr.addColorStop(1, "rgba(18,26,52,.30)");
  bx.save(); bx.globalCompositeOperation = "overlay"; bx.fillStyle = gr; bx.fillRect(0, 0, w, h); bx.restore();
  // 暗角原本 .62 太重，跟著把地圖邊緣一起吃掉；壓到 .42 保留「畫框」的味道就好。
  const vg = bx.createRadialGradient(w * .5, h * .5, h * .34, w * .5, h * .5, h * 1.02);
  vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, "rgba(6,4,3,.42)");
  bx.fillStyle = vg; bx.fillRect(0, 0, w, h);
  if (flash > 0) { bx.fillStyle = `rgba(178,42,32,${flash * .42})`; bx.fillRect(0, 0, w, h); }
}

function drawScene(now, t) {

  sc.save(); sc.translate(shx, shy);

  // 地圖（含城外那一圈郊野）
  const m = world.margin || 0, o = toScreen(-m, -m);
  sc.drawImage(world, 0, 0, world.width, world.height, o.sx, o.sy, (W + m*2)*t, (H + m*2)*t);

    sc.fillStyle = `rgba(255,238,170,${.25+.35*gl})`; sc.beginPath(); sc.arc(basin.sx, basin.sy, t*.42, 0, 6.3); sc.fill();

    sc.save(); sc.setLineDash(dash); sc.strokeStyle = col; sc.lineWidth = 2; sc.globalAlpha = .8;
    sc.beginPath(); sc.moveTo(A.sx, A.sy - t*.2); sc.lineTo(B.sx, B.sy - t*.2); sc.stroke(); sc.restore();

  rel.spoke[selected] && Object.keys(rel.spoke[selected]).forEach(k => { if (relSeen(selected,k)) link(k, "rgba(240,230,205,.5)", [2,6]); });

/* ============================ roster ============================ */
const rosterEl = document.getElementById("roster");
IDS.forEach(id => {
  const p = P[id], li = document.createElement("li"); li.dataset.id = id;
  if (PORTRAIT[id]) {
    const wrap = document.createElement("span"); wrap.className = "rface";
    const im = document.createElement("img"); im.src = PORTRAIT[id]; im.alt = "";
    wrap.appendChild(im); li.appendChild(wrap);
  } else {
    const f = faceCanvas(id, 34); f.className = "rface"; li.appendChild(f);
  }
  const mid = document.createElement("span");
  mid.innerHTML = `<span class="rname">${esc(p.name)}</span><br><span class="rmeta">${esc(p.sect)} · ${esc(p.title)}</span>`;
  li.appendChild(mid);
  const st = document.createElement("span"); st.className = "rstat"; li.appendChild(st);
  li.onclick = () => openSheet(id);
  rosterEl.appendChild(li);
});
function renderRoster() {
  const fr = F[cur];
  [...rosterEl.children].forEach(li => {
    const id = li.dataset.id, a = fr.agents[id], st = li.querySelector(".rstat");
    li.classList.toggle("gone", !a.alive); li.classList.toggle("sel", selected === id);
    const d = deaths.find(x => x.id === id && x.t <= cur);
    if (!a.alive) st.innerHTML = `<span class="tag dead">已歿</span><br><span class="rmeta">${d ? esc(deathCause(d.by)) : ""}</span>`;
    else st.innerHTML = a.wound >= 2 ? `<span class="tag crit">重傷</span>` : a.wound === 1 ? `<span class="tag hurt">帶傷</span>` : `<span class="tag ok">${SCENARIO === "tempest" ? "平安" : "無傷"}</span>`;
  });
  const dead = IDS.filter(id => !fr.agents[id].alive).length;
  document.getElementById("deadcount").textContent = dead ? `已歿 ${dead}` : "";
}

/* ============================ 角色卡 ============================ */
const sheetHost = document.getElementById("sheetHost");
/* 目的（quest）與絕技（工具）——這兩段是「這個人今天想幹嘛、手上有什麼」。
   目的一律取自 goal_* 事件，也就是世界真的判出來的結果，不是劇本上寫的願望。
   注意要照當下的 cur 篩：還沒發生的結局不能先劇透。                            */
const GOALS_BY = (() => {
  const m = {};
  (DATA.goals || []).forEach(g => (m[g.agent] = m[g.agent] || []).push(g));
  Object.values(m).forEach(list => list.sort((a, b) => a.idx - b.idx));
  return m;
})();
const ARTS_USED = (() => {
  const m = {};
  F.forEach(fr => fr.events.forEach(e => {
    if (e.kind === "art") (m[e.agent] = m[e.agent] || []).push({ t: fr.tick, art: e.art });
  }));
  return m;
})();

function questHTML(id) {
  const gs = GOALS_BY[id] || [];
  if (!gs.length) return "";
  const rows = gs.map(g => {
    const settled = g.tick <= cur;
    const cls = !settled ? "open" : g.done ? "done" : "fail";
    const mark = !settled ? "…" : g.done ? "✓" : "✕";
    const note = settled ? `<em>${esc(g.note)}　${clockOf(g.tick).str}</em>` : `<em>還在進行</em>`;
    return `<div class="qz ${cls}"><b>${mark}</b><span>${esc(g.text)}${note}</span></div>`;
  }).join("");
  const done = gs.filter(g => g.tick <= cur && g.done).length;
  const settled = gs.filter(g => g.tick <= cur).length;
  return `<div class="sec"><span class="lb">今天要做到的事 ${settled ? `（${done}/${gs.length} 達成）` : ""}</span>
    <div class="quest" data-n="${settled}">${rows}</div></div>`;
}

function artsSecHTML(id) {
  const arts = (CAST[id] || {}).arts || [];
  if (!arts.length) return "";
  const used = (ARTS_USED[id] || []).filter(u => u.t <= cur);
  const count = {};
  used.forEach(u => { count[u.art] = (count[u.art] || 0) + 1; });
  const rows = arts.map(a => {
    const n = count[a.name] || 0;
    const ic = artIconSrc(a.id || a.name);
    return `<div class="az ${n ? "used" : ""}" title="${esc(a.tagline)}">
      <img class="aic" src="${ic}" alt="">
      <b>${esc(a.name)}</b><span>${esc(a.cost || "不限次數")}</span>
      <u>${n ? `已使 ${n} 次` : "還沒用過"}</u></div>`;
  }).join("");
  return `<div class="sec"><span class="lb">絕技 ${used.length ? `（共使出 ${used.length} 次）` : ""}</span>
    <div class="arts" data-n="${used.length}">${rows}</div></div>`;
}

function openSheet(id) {
  selected = id; const p = P[id], c = CAST[id], fr = F[cur].agents[id];
  let thought = null; for (let k = cur; k >= 0; k--) { const th = F[k].agents[id].thought; if (th) { thought = { t:k, th }; break; } }
  const said = (saidBy[id] || []).filter(s => s.t <= cur).slice(-4).reverse();
  const kin = (c.kin || []).filter(k => P[k]).map(k => `<span class="kin">知音 · ${esc(P[k].name)}</span>`);
  const spoke = Object.keys(rel.spoke[id] || {}).filter(k => relSeen(id,k) && P[k]).map(k => `<span>說過話 · ${esc(P[k].name)}</span>`);
  const foe = Object.keys(rel.foe[id] || {}).filter(k => rel.foe[id][k] <= cur && P[k]).map(k => `<span class="foe">動過手 · ${esc(P[k].name)}</span>`);
  const d = deaths.find(x => x.id === id && x.t <= cur);
  const status = !fr.alive
    ? `<span class="tag dead">已歿 ${clockOf(d ? d.t : cur).str}${d && d.by ? " · "+esc(deathCause(d.by)) : ""}</span>`
    : fr.wound >= 2 ? `<span class="tag crit">重傷</span>`
    : fr.wound === 1 ? `<span class="tag hurt">帶傷</span>`
    : `<span class="tag ok">${SCENARIO === "tempest" ? "平安" : "無傷"}</span>`;
  sheetHost.innerHTML = `<div class="sheet">
    <div class="hd">${PORTRAIT[id]
        ? `<img class="bust" id="sheetFace" src="${PORTRAIT[id]}" alt="${esc(p.name)}" title="點看大圖">`
        : `<canvas id="sheetFace" class="bust" width="120" height="160"></canvas>`}
      <div><div class="nm">${esc(p.name)}</div><div class="sb">${esc(p.sect)} · ${esc(p.title)}</div>
        <div class="sb status" style="margin-top:5px">${status}</div></div>
      <button class="x" id="sheetX" aria-label="關閉">✕</button></div>
    <div class="body">
      <div class="sec"><span class="lb">今日所求</span><div class="goal">「${esc(p.goal)}」</div></div>
      ${questHTML(id)}
      <div class="sec"><span class="lb">${SCENARIO === "tempest" ? "本事" : "武功"} ${c.skill} / 10</span><div class="bars">${Array.from({length:10},(_,i)=>`<i class="${i<c.skill?"on":""}"></i>`).join("")}</div></div>
      ${artsSecHTML(id)}
      <div class="sec"><span class="lb">此人</span><p>${esc(p.blurb)}</p></div>
      <div class="sec"><span class="lb thoughtLab">此刻在想（${thought?clockOf(thought.t).str:"—"}）</span>
        <p class="q thoughtTxt">${thought?esc(thought.th):"還沒起念。"}</p></div>
      <div class="sec"><span class="lb">說過的話</span><div class="said" data-n="${said.length}">${said.length?said.map(s=>
        `<div data-t="${s.t}"><em>${clockOf(s.t).str}${s.to&&P[s.to]?" → "+esc(P[s.to].name):""}</em><br>${esc(s.text)}</div>`).join(""):`<span style="color:var(--ink2);font-size:12px">還沒開過口。</span>`}</div></div>
      <div class="sec"><span class="lb">關係（到此刻為止）</span><div class="rel">${[...kin,...foe,...spoke].join("")||`<span>還沒和誰打過交道</span>`}</div></div>
      <div class="sec"><span class="lb">現在在</span>
        <p class="areaTxt" style="color:var(--ink2)">${esc(fr.area||"長街")}${AREA_OF[fr.area]?"　"+esc(AREA_OF[fr.area].desc):""}</p>
        ${SCENES[fr.area] ? `<img class="vignette" data-area="${esc(fr.area)}" src="${SCENES[fr.area]}" alt="">` : ""}</div>
    </div></div>`;
  const face = document.getElementById("sheetFace");
  if (face.tagName === "CANVAS") drawBust(face.getContext("2d"), 120, p, { wound:fr.wound, dead:!fr.alive });
  else { face.style.filter = fr.alive ? "none" : "grayscale(1) brightness(.55)"; face.onclick = () => lightbox(id); }
  document.getElementById("sheetX").onclick = closeSheet;
  sheetHost.querySelectorAll(".said div").forEach(d2 => d2.onclick = () => seek(+d2.dataset.t));
  renderRoster();
}
function closeSheet() { selected = null; sheetHost.innerHTML = ""; renderRoster(); }

/* 每 tick 只改「會變的那幾格」。整段 innerHTML 重建會讓瀏覽器把 78 KB 的立繪
   重新解碼一次，播放中每秒好幾次——這是先前會卡的主因之一。 */
function refreshSheet() {
  const id = selected, host = sheetHost.querySelector(".sheet");
  if (!id || !host) { if (id) openSheet(id); return; }
  const fr = F[cur].agents[id], d = deaths.find(x => x.id === id && x.t <= cur);
  const st = host.querySelector(".status");
  if (st) st.innerHTML = !fr.alive
      ? `<span class="tag dead">已歿 ${clockOf(d ? d.t : cur).str}${d && d.by ? " · "+esc(deathCause(d.by)) : ""}</span>`
      : fr.wound >= 2 ? `<span class="tag crit">重傷</span>`
      : fr.wound === 1 ? `<span class="tag hurt">帶傷</span>`
      : `<span class="tag ok">${SCENARIO === "tempest" ? "平安" : "無傷"}</span>`;
  const face = host.querySelector("#sheetFace");
  if (face && face.tagName === "IMG") face.style.filter = fr.alive ? "none" : "grayscale(1) brightness(.55)";
  let thought = null;
  for (let k = cur; k >= 0; k--) { const th = F[k].agents[id].thought; if (th) { thought = { t:k, th }; break; } }
  const tl = host.querySelector(".thoughtLab"), tp = host.querySelector(".thoughtTxt");
  if (tl) tl.textContent = `此刻在想（${thought ? clockOf(thought.t).str : "—"}）`;
  if (tp) tp.textContent = thought ? thought.th : "還沒起念。";
  const said = (saidBy[id] || []).filter(s2 => s2.t <= cur).slice(-4).reverse();
  const sd = host.querySelector(".said");
  if (sd && sd.dataset.n !== String(said.length)) {
    sd.dataset.n = String(said.length);
    sd.innerHTML = said.length ? said.map(s2 =>
      `<div data-t="${s2.t}"><em>${clockOf(s2.t).str}${s2.to && P[s2.to] ? " → " + esc(P[s2.to].name) : ""}</em><br>${esc(s2.text)}</div>`
    ).join("") : `<span style="color:var(--ink2);font-size:12px">還沒開過口。</span>`;
    sd.querySelectorAll("div").forEach(d2 => d2.onclick = () => seek(+d2.dataset.t));
  }
  const ar = host.querySelector(".areaTxt");
  if (ar) ar.textContent = (fr.area || "長街") + (AREA_OF[fr.area] ? "　" + AREA_OF[fr.area].desc : "");
  let vg = host.querySelector(".vignette");
  const sceneUrl = SCENES[fr.area];
  if (sceneUrl) {
    if (!vg) {
      vg = document.createElement("img"); vg.className = "vignette"; vg.alt = "";
      ar && ar.parentElement && ar.parentElement.appendChild(vg);
    }
    if (vg.dataset.area !== fr.area) { vg.dataset.area = fr.area || ""; vg.src = sceneUrl; }
  } else if (vg) {
    vg.remove();
  }
  // 目的與絕技也跟著時間走。整段換掉沒關係——這兩格沒有立繪，重畫很便宜；
  // 但仍然只在真的變了才換，否則播放中每秒好幾次的重建會把捲動位置洗掉。
  const swap = (sel, n, html) => {
    const el = host.querySelector(sel);
    if (el && el.dataset.n !== String(n)) el.closest(".sec").outerHTML = html;
  };
  swap(".quest", (GOALS_BY[id] || []).filter(g => g.tick <= cur).length, questHTML(id));
  swap(".arts", (ARTS_USED[id] || []).filter(u => u.t <= cur).length, artsSecHTML(id));
}

/* ============================ 覆蓋層（名牌 / 氣泡） ============================ */
function syncOverlay() {
  const t = tileSize(), fr = F[cur];
  IDS.forEach(id => {
    let pl = ov.querySelector(`.plate[data-id="${id}"]`);
    if (!pl) { pl = document.createElement("div"); pl.className = "plate"; pl.dataset.id = id;
      pl.innerHTML = `<i style="background:${P[id].color}"></i>${esc(P[id].name)}`; ov.appendChild(pl); }
    const m = animPos(id), s = toScreen(m.x, m.y);
    pl.style.left = s.sx + "px"; pl.style.top = (s.sy + t*.34) + "px";
    pl.classList.toggle("gone", !fr.agents[id].alive);
    pl.style.display = (s.sx < -80 || s.sx > SW+80 || s.sy < -60 || s.sy > SH+70) ? "none" : "";
    pl.style.opacity = t < 26 ? .0 : 1;
  });
  // 氣泡
  const want = {};
  if (sub > .18) fr.events.forEach(e => { if (e.kind === "speech") want[e.agent] = e; });
  [...ov.querySelectorAll(".bubble")].forEach(b => { if (!want[b.dataset.id]) b.remove(); });
  Object.keys(want).forEach(id => {
    const e = want[id];
    let b = ov.querySelector(`.bubble[data-id="${id}"]`);
    if (!b) { b = document.createElement("div"); b.className = "bubble"; b.dataset.id = id;
      b.innerHTML = `<b>${esc(P[id].name)}${e.to && P[e.to] ? "→"+esc(P[e.to].name) : ""}：</b>${esc(e.text)}<span class="tail"></span>`;
      ov.appendChild(b); }
    const m = animPos(id), s = toScreen(m.x, m.y), bw = b.offsetWidth || 180;
    const below = s.sy - t*.9 - b.offsetHeight < 4;
    b.classList.toggle("below", below);
    const left = clamp(s.sx - bw/2, 6, Math.max(6, SW - bw - 6));
    b.style.left = left + "px";
    b.style.top = (below ? s.sy + t*.55 : s.sy - t*.75) + "px";
    b.querySelector(".tail").style.left = clamp(s.sx - left, 12, bw - 12) + "px";
  });
}
function toast(text) {
  if (toastEl) toastEl.remove();
  toastEl = document.createElement("div"); toastEl.className = "toast"; toastEl.textContent = text;
  ov.appendChild(toastEl);
  const el = toastEl; setTimeout(() => { if (el.parentNode) el.remove(); if (toastEl === el) toastEl = null; }, 2300);
}

/* ============================ 每 tick 的節拍 ============================ */
function enterTick(t, animate) {
  cur = clamp(t, 0, MAXT); sub = 0;
  for (const k in fired) delete fired[k];
  renderHud(); renderRoster(); renderFeed(false);
  if (selected) refreshSheet();                      // 只更新會變的欄位，不動立繪
}
function tickBeats(now) {
  const fr = F[cur];
  fr.events.forEach((e, i) => {
    const key = cur + ":" + i;
    if (fired[key]) return;
    if (e.kind === "attack" && sub > .34) {
      fired[key] = 1;
      const A = F[cur].agents[e.agent], B = F[cur].agents[e.target];
      fxList.push({ kind:"slash", t0:now, life:420, ax:A.x+.5, ay:A.y+.5, bx:B.x+.5, by:B.y+.5 });
      fxList.push({ kind:"blood", t0:now+120, life:520, bx:B.x+.5, by:B.y+.5, seed:Math.random()*6 });
      fxLunge[e.agent] = 1; fxLungeDir[e.agent] = { x:B.x-A.x, y:B.y-A.y };
      setTimeout(() => { fxLunge[e.agent] = 0; }, 260);
      if (!reduced) { shake = 9; flash = 1; hold = now + 260; }
    } else if (e.kind === "death" && sub > .5) {
      fired[key] = 1; toast(e.name + " 歿");
      if (!reduced) { shake = 6; flash = .8; hold = now + 420; }
    }
  });
}

/* ============================ 鏡頭目標 ============================ */
function camTarget() {
  const fr = F[cur], live = IDS.filter(id => fr.agents[id].alive);
  let focus = null, z = 1;
  const att = fr.events.find(e => e.kind === "attack") || fr.events.find(e => e.kind === "death");
  const sp = fr.events.find(e => e.kind === "speech");
  if (att) {
    const A = fr.agents[att.agent], B = att.target ? fr.agents[att.target] : A;
    focus = { x:(A.x+B.x)/2 + .5, y:(A.y+B.y)/2 + .5 }; z = 2.1;
  } else if (sp) {
    const A = fr.agents[sp.agent], B = sp.to && fr.agents[sp.to] ? fr.agents[sp.to] : A;
    focus = { x:(A.x+B.x)/2 + .5, y:(A.y+B.y)/2 + .5 }; z = 1.6;
  } else if (live.length) {
    let sx = 0, sy = 0, minx=99, maxx=-99, miny=99, maxy=-99;
    live.forEach(id => { const a = fr.agents[id]; sx += a.x; sy += a.y;
      minx=Math.min(minx,a.x); maxx=Math.max(maxx,a.x); miny=Math.min(miny,a.y); maxy=Math.max(maxy,a.y); });
    focus = { x:sx/live.length + .5, y:sy/live.length + .5 };
    const spread = Math.max((maxx-minx)/W, (maxy-miny)/H);
    z = clamp(1 / Math.max(.42, spread + .28), 1, 1.7);
  } else focus = { x:W/2, y:H/2 };
  if (selected) { const a = fr.agents[selected]; focus = { x:a.x+.5, y:a.y+.5 }; z = Math.max(z, 1.8); }
  camT.x = focus.x; camT.y = focus.y; camT.z = clamp(z * Math.pow(1.25, userZoom), 1, 3.4);
}

/* ============================ 主迴圈 ============================ */
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(90, now - (last || now)); last = now;
  if (started && playing && now > hold) {
    sub += dt / (TICK_MS / speed);
    if (sub >= 1) { if (cur >= MAXT) { setPlay(false); sub = 1; showOutro(); } else { enterTick(cur + 1, true); } }
  }
  if (started) tickBeats(now);
  if (camMode === "follow") camTarget();
  else { camT.x = W/2; camT.y = H/2; camT.z = clamp(Math.pow(1.25, userZoom), 1, 3.4); }
  clampCam(camT);
  const k = reduced ? 1 : 1 - Math.pow(.001, dt/1000);
  cam.x = lerp(cam.x, camT.x, k*0.9); cam.y = lerp(cam.y, camT.y, k*0.9); cam.z = lerp(cam.z, camT.z, k*0.7);
  clampCam(cam);
  shake *= Math.pow(.86, dt/16); if (shake < .3) shake = 0;
  flash *= Math.pow(.9, dt/16); if (flash < .02) flash = 0;
  drawFrame(now); syncOverlay();
  const el = feedEl.querySelector(".fe.now");
  document.getElementById("fill").style.width = (cur/MAXT*100) + "%";
  document.getElementById("knob").style.left = (cur/MAXT*100) + "%";
}

/* ============================ HUD / 控制 ============================ */
function renderHud() {
  const ck = clockOf(cur);
  document.getElementById("clock").innerHTML = `${ck.str} <span class="shichen">${ck.sc}時</span>`;
  document.getElementById("phase").textContent = ck.ph;
  const live = IDS.filter(id => F[cur].agents[id].alive).length;
  document.getElementById("surv").textContent = live;
  document.getElementById("alivebox").classList.toggle("bleed", live < 6);
  document.getElementById("tickno").textContent = "tick " + cur;
  document.getElementById("seek").value = cur;
  const nx = hitTicks.find(t => t > cur), pv = [...hitTicks].reverse().find(t => t < cur);
  document.getElementById("nextHit").disabled = nx === undefined;
  document.getElementById("prevHit").disabled = pv === undefined;
}
function seek(t) { setPlay(false); enterTick(t, false); renderFeed(true); }
const playBtn = document.getElementById("play");
function setPlay(v) {
  if (v && cur >= MAXT) { enterTick(0, false); renderFeed(true); }
  playing = v; playBtn.textContent = v ? "⏸ 暫停" : "▶ 播放";
}
playBtn.onclick = () => setPlay(!playing);
document.getElementById("stepF").onclick = () => seek(cur + 1);
document.getElementById("stepB").onclick = () => seek(cur - 1);
document.getElementById("nextHit").onclick = () => { const n = hitTicks.find(t => t > cur); if (n !== undefined) seek(n); };
document.getElementById("prevHit").onclick = () => { const n = [...hitTicks].reverse().find(t => t < cur); if (n !== undefined) seek(n); };
document.querySelectorAll(".spd button").forEach(b => b.onclick = () => {
  speed = +b.dataset.spd;
  document.querySelectorAll(".spd button").forEach(x => x.setAttribute("aria-pressed", x === b ? "true" : "false"));
});
document.getElementById("seek").oninput = e => seek(+e.target.value);
document.getElementById("seek").max = MAXT;
const camBtn = document.getElementById("camBtn");
camBtn.onclick = () => { camMode = camMode === "follow" ? "wide" : "follow";
  camBtn.textContent = camMode === "follow" ? "🎥 跟隨" : "🗺 全景";
  camBtn.setAttribute("aria-pressed", camMode === "follow" ? "true" : "false"); };
const fxLabel = () => (DOF || BLOOM) ? "✨ 特效" : "✨ 特效：關";
document.getElementById("fxBtn").onclick = function () {
  const on = DOF || BLOOM; DOF = BLOOM = on ? 0 : 1; autoTuned = ""; slowFrames = 0; frameCost = 16;
  this.textContent = fxLabel(); this.setAttribute("aria-pressed", String(!on));
};
document.getElementById("fxBtn").setAttribute("aria-pressed", "true");
document.getElementById("zoomIn").onclick = () => { userZoom = clamp(userZoom + 1, -2, 4); };
document.getElementById("zoomOut").onclick = () => { userZoom = clamp(userZoom - 1, -2, 4); };
addEventListener("keydown", e => {
  const lb = document.querySelector(".ptlb");
  if (lb) { lb.remove(); e.preventDefault(); return; }      // 大圖蓋住全畫面，任何鍵都先關掉它
  if (e.target.tagName === "INPUT" || document.querySelector(".over")) return;
  if (e.key === " ") { e.preventDefault(); setPlay(!playing); }
  else if (e.key === "ArrowRight") seek(cur + 1);
  else if (e.key === "ArrowLeft") seek(cur - 1);
  else if (e.key === "Escape") closeSheet();
});
// 點舞台選人
stage.addEventListener("click", ev => {
  if (ev.target.closest(".chip")) return;
  const r = stage.getBoundingClientRect(), t = tileSize();
  const mx = ev.clientX - r.left, my = ev.clientY - r.top;
  let best = null, bd = 1e9;
  IDS.forEach(id => { const m = animPos(id), s = toScreen(m.x, m.y);
    const d = Math.hypot(s.sx - mx, s.sy - my); if (d < bd) { bd = d; best = id; } });
  if (best && bd < t * .7) { if (selected === best) closeSheet(); else openSheet(best); }
});

/* 時間軸標記 */
(function marks() {
  const tr = document.getElementById("track");
  moments.forEach(m => {
    const d = document.createElement("div");
    d.className = "mk" + (m.kind === "attack" ? " a" : "");
    const ic = m.kind === "death" ? ICONS.death
      : m.kind === "storm" ? ICONS.world
      : ICONS.attack;
    d.innerHTML = `<img src="${ic}" alt="">`;
    d.style.left = (m.t / MAXT * 100) + "%";
    d.title = `${clockOf(m.t).str}　${m.label}`;
    d.onclick = () => seek(m.t);
    tr.appendChild(d);
  });
})();
document.getElementById("legend").innerHTML =
  IDS.map(id => `<span><i style="background:${P[id].color}"></i>${esc(P[id].name)} · ${esc(P[id].sect)}</span>`).join("")
  + (SCENARIO === "tempest" || !HAS_COMBAT
      ? `<span><img class="ic" src="${ICONS.world}" alt="">暴潮</span><span><img class="ic" src="${ICONS.death}" alt="">捲走</span>`
      : `<span><img class="ic" src="${ICONS.attack}" alt="">動手</span><span><img class="ic" src="${ICONS.death}" alt="">命殞</span>`)
  + `<span style="margin-left:auto">空白鍵播放／暫停　←→ 逐刻　點人看他是誰</span>`;

/* ============================ 片頭 / 片尾 ============================ */
let CITY_URL = null;                                  // 沒有場景圖時，退回整座像素城
function cityBackdrop(tintTop, tintBottom) {
  if (CITY_URL === null) { try { CITY_URL = world.toDataURL(); } catch (e) { CITY_URL = ""; } }
  return CITY_URL ? `linear-gradient(${tintTop}, ${tintBottom}), url(${CITY_URL})` : "";
}
function overlay(html, tint, sceneKey) {
  const d = document.createElement("div"); d.className = "over"; d.innerHTML = `<div class="in">${html}</div>`;
  const top = tint ? tint[0] : "rgba(9,7,5,.80)", bot = tint ? tint[1] : "rgba(9,7,5,.93)";
  const art = sceneKey && SCENES[sceneKey];
  if (art) {
    d.style.backgroundImage = `linear-gradient(${top}, ${bot}), url(${art})`;
    d.style.backgroundSize = "cover"; d.style.backgroundPosition = "center";
  } else {
    const bg = cityBackdrop(top, bot);
    if (bg) { d.style.backgroundImage = bg; d.style.backgroundSize = "cover";
      d.style.backgroundPosition = "center"; d.style.imageRendering = "pixelated"; }
  }
  document.body.appendChild(d); return d;
}
function showIntro() {
  const cards = IDS.map((id, i) => `<div class="cc" style="animation-delay:${.12 + i*.08}s">
      ${PORTRAIT[id] ? `<img class="pt" src="${PORTRAIT[id]}" alt="${esc(P[id].name)}">`
                     : `<canvas data-id="${id}" width="90" height="120"></canvas>`}
      <div class="n">${esc(P[id].name)}</div><div class="s">${esc(P[id].sect)}</div>
      <div class="g">${esc(P[id].goal)}</div></div>`).join("");
  const d = overlay(`
    <div class="k">TRUMAN · LLM 箱庭</div>
    <h2>${esc(DATA.title || "")}</h2>
    <p class="lede">${DATA.lede || ""}<br>
      以下是那一天的完整實錄，一刻十分鐘，共 ${MAXT} 刻。</p>
    <div class="cast">${cards}</div>
    <div class="btns"><button class="big" id="go">${esc(DATA.cta || "▶ 開　始")}</button>
      <button class="big ghost" id="skip">直接看結局</button></div>`,
    null, "keyart");
  d.querySelectorAll(".cc canvas").forEach(c => drawBust(c.getContext("2d"), 90, P[c.dataset.id]));
  d.querySelector("#go").onclick = () => { d.remove(); started = true; enterTick(0, false); renderFeed(true); setPlay(true); };
  d.querySelector("#skip").onclick = () => { d.remove(); started = true; enterTick(MAXT, false); renderFeed(true); showOutro(); };
}
/* 片尾成績單：誰做到了今天要做的事。
   死亡名單講的是「發生了什麼」，這一張講的是「誰要的東西拿到了」——
   後者才看得出來目的與工具配得對不對，也才是換一組配置重跑時要比的東西。 */
function scoreHTML() {
  const gs = DATA.goals || [];
  if (!gs.length) return "";
  const rows = IDS.filter(id => gs.some(g => g.agent === id)).map(id => {
    const mine = gs.filter(g => g.agent === id).sort((a, b) => a.idx - b.idx);
    const cells = mine.map(g =>
      `<i class="${g.done ? "y" : "n"}" title="${esc(g.text)}　${esc(g.note)}">${g.done ? "✓" : "✕"}</i>`).join("");
    return `<div class="sr">
      ${PORTRAIT[id] ? `<span class="sf"><img src="${PORTRAIT[id]}" alt=""></span>` : ""}
      <span class="who" style="color:${P[id].color}">${esc(P[id].name)}</span>
      <span class="gt">${esc(mine.map(g => g.text).join("；"))}</span>
      <span class="gm">${cells}</span></div>`;
  }).join("");
  return `<div class="score"><div class="sh">今天誰拿到了自己要的東西</div>${rows}</div>`;
}

function showOutro() {
  if (document.querySelector(".over")) return;
  const live = IDS.filter(id => F[MAXT].agents[id].alive);
  const tomb = deaths.map(d => `<div><span class="who" style="color:${P[d.id].color}">${esc(d.name)}</span>
      <span style="color:#b9ac92">${clockOf(d.t).str}　${esc(P[d.id].sect)}</span>
      <span class="by">${esc(deathCause(d.by) || "死因不明")}</span></div>`).join("");
  const s = DATA.stats || {};
  const outcomeLine = DATA.outcome_text
    ? `<p class="lede" style="color:var(--gold)">${esc(String(DATA.outcome_text).replace(/^[（(]|[）)]$/g, ""))}</p>`
    : "";
  const h2 = DATA.outcome === "held" ? "嵐潮，守住了"
    : DATA.outcome === "lost" ? "滅村的邊緣"
    : DATA.outcome === "partial" ? "只救回了一半"
    : (live.length === 1 ? "只剩一個人站著" : (SCENARIO === "tempest" ? "潮退了" : "城裡靜下來了"));
  const kicker = SCENARIO === "tempest" ? "亥時 · 暴潮過後" : "亥時 · 這一天結束了";
  const ledeTail = SCENARIO === "tempest"
    ? "每一句勸、每一次趕路都是 agent 自己算過後的決定——對手是海，勝負看誰把人送到該去的地方。"
    : "每一句話、每一次趕路都是 agent 自己算過後的決定——箱庭要看的就是這種結構性衝突下長出來的軌跡。";
  const combatStat = (SCENARIO === "tempest" || !HAS_COMBAT)
    ? `<div><b>${FLOODED.length || "0"}</b><span>格淹水</span></div>
      <div><b>${deaths.length}</b><span>人被捲走</span></div>`
    : `<div><b>${s.attacks ?? moments.filter(m=>m.kind==="attack").length}</b><span>次動手</span></div>
      <div><b>${deaths.length}</b><span>人死了</span></div>`;
  const d = overlay(`
    <div class="k">${esc(kicker)}</div>
    <h2>${esc(h2)}</h2>
    ${outcomeLine}
    <div class="tomb">${tomb}</div>
    <p class="lede">活到最後的是 ${live.map(id => `<b style="color:${P[id].color}">${esc(P[id].name)}</b>`).join("、") || "——"}。
      ${ledeTail}</p>
    ${scoreHTML()}
    <div class="nums">
      <div><b>${s.speeches ?? "—"}</b><span>句對話</span></div>
      <div><b>${s.arts ?? 0}</b><span>次使出絕技</span></div>
      ${combatStat}
      <div><b>${s.goals_total ? `${s.goals_done}/${s.goals_total}` : "—"}</b><span>目的達成</span></div>
      <div><b>${MAXT}</b><span>個決策時刻</span></div>
    </div>
    <div class="btns"><button class="big" id="again">↻ 再看一次</button>
      <button class="big ghost" id="stay">留在最後一刻</button></div>`,
    ["rgba(28,8,6,.86)", "rgba(9,7,5,.96)"], "night");
  d.querySelector("#again").onclick = () => { d.remove(); enterTick(0, false); renderFeed(true); setPlay(true); };
  d.querySelector("#stay").onclick = () => d.remove();
}

/* ============================ 啟動 ============================ */
new ResizeObserver(() => layout()).observe(stage);
layout(); enterTick(0, false); renderFeed(true);
cam.x = camT.x = W/2; cam.y = camT.y = H/2; cam.z = camT.z = 1;
requestAnimationFrame(loop);
showIntro();
</script>
